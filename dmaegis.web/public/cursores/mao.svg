<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 32 32">
  <!-- DMAegis: mão no formato clássico (sobre o que é clicável), azul-noite com contorno azul claro. Desenho próprio. Ponta do dedo = ponto ativo (13, 2). -->
  <defs>
    <g id="forma">
      <rect x="10.8" y="1.8" width="4.6" height="14" rx="2.3"/>
      <rect x="15.2" y="10.6" width="4.1" height="6.4" rx="2.05"/>
      <rect x="19.1" y="11.6" width="3.8" height="5.8" rx="1.9"/>
      <rect x="22.7" y="13" width="3.5" height="5.2" rx="1.75"/>
      <path d="M10.8 13.4 H26.2 V21.4 Q26.2 29 19.3 29 H16.2 Q10.8 29 10.8 23.6 Z"/>
      <path d="M11.6 18 Q8.9 15.5 7.3 16.8 Q6.1 18 7.5 19.8 L10.8 24 Z"/>
    </g>
    <linearGradient id="ceu" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1d3478"/>
      <stop offset="1" stop-color="#0c1638"/>
    </linearGradient>
  </defs>
  <!-- Halo escuro, contorno azul claro e preenchimento: a união das formas fica com uma borda só. -->
  <g fill="none" stroke="#070b1f" stroke-width="3.4" stroke-linejoin="round"><use xlink:href="#forma" href="#forma"/></g>
  <g fill="none" stroke="#9fd6ff" stroke-width="1.3" stroke-linejoin="round"><use xlink:href="#forma" href="#forma"/></g>
  <g fill="url(#ceu)"><use xlink:href="#forma" href="#forma"/></g>
  <path d="M15.3 13.6 v3 M19.2 13.9 v3 M22.8 14.8 v2.6" stroke="#9fd6ff" stroke-opacity="0.55" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M18.8 21.2 L19.25 22.35 L20.4 22.8 L19.25 23.25 L18.8 24.4 L18.35 23.25 L17.2 22.8 L18.35 22.35 Z" fill="#dff2ff"/>
</svg>
