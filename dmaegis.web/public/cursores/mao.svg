<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40" height="40" viewBox="0 0 40 40">
  <!-- DMAegis: mão de céu noturno apontando (sobre o que é clicável). Desenho próprio. Ponta do dedo = ponto ativo (15, 3). -->
  <defs>
    <g id="forma">
      <rect x="12" y="2.4" width="6.4" height="20" rx="3.2"/>
      <rect x="18" y="13" width="5.6" height="9.4" rx="2.8"/>
      <rect x="23.2" y="14.4" width="5.2" height="8.6" rx="2.6"/>
      <rect x="28" y="16.2" width="4.8" height="7.4" rx="2.4"/>
      <path d="M12 17 H32.8 V27.5 Q32.8 37 23.5 37 H19 Q12 37 12 30 Z"/>
      <path d="M13.2 23 Q9.4 18.6 6.8 20.4 Q4.8 22 6.6 24.8 L12.6 33 Z"/>
    </g>
    <!-- O recorte não aceita um grupo via <use>: as formas vão direto aqui. -->
    <clipPath id="recorte">
      <rect x="12" y="2.4" width="6.4" height="20" rx="3.2"/>
      <rect x="18" y="13" width="5.6" height="9.4" rx="2.8"/>
      <rect x="23.2" y="14.4" width="5.2" height="8.6" rx="2.6"/>
      <rect x="28" y="16.2" width="4.8" height="7.4" rx="2.4"/>
      <path d="M12 17 H32.8 V27.5 Q32.8 37 23.5 37 H19 Q12 37 12 30 Z"/>
      <path d="M13.2 23 Q9.4 18.6 6.8 20.4 Q4.8 22 6.6 24.8 L12.6 33 Z"/>
    </clipPath>
    <linearGradient id="ceu" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1e3c8f"/>
      <stop offset="1" stop-color="#0e1b4d"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad4ff"/>
      <stop offset="1" stop-color="#5aa8f0"/>
    </linearGradient>
  </defs>
  <!-- Halo escuro, contorno azul claro e o céu por dentro: a união das formas fica com uma borda só. -->
  <use xlink:href="#forma" href="#forma" fill="none" stroke="#070b1f" stroke-width="5" stroke-linejoin="round"/>
  <use xlink:href="#forma" href="#forma" fill="none" stroke="#8fd0ff" stroke-width="2.6" stroke-linejoin="round"/>
  <g clip-path="url(#recorte)">
    <rect width="40" height="40" fill="url(#ceu)"/>
    <!-- Onda clara do lado direito, como uma nuvem de luz -->
    <path d="M40 12 L27 12 C24.6 17 26.4 21 24 25 C21.6 29 23.4 33.5 20 37.5 L40 37.5 Z" fill="url(#onda)" fill-opacity="0.85"/>
    <path d="M40 17 L30.4 17 C28.6 21 30 24 28 27.6 C26 31.2 27.4 34.6 24.6 37.5 L40 37.5 Z" fill="#c7e8ff" fill-opacity="0.45"/>
    <!-- Lua crescente na palma -->
    <path d="M18.6 24.4 a4.4 4.4 0 1 0 4.6 6.2 a3.4 3.4 0 1 1 -4.6 -6.2 Z" fill="#bfe6ff"/>
    <!-- Estrelas -->
    <path d="M15.2 9.4 L15.7 10.7 L17 11.2 L15.7 11.7 L15.2 13 L14.7 11.7 L13.4 11.2 L14.7 10.7 Z" fill="#fff"/>
    <path d="M14.6 27.6 L15 28.6 L16 29 L15 29.4 L14.6 30.4 L14.2 29.4 L13.2 29 L14.2 28.6 Z" fill="#fff"/>
    <circle cx="16.6" cy="5.6" r="0.6" fill="#fff"/>
    <circle cx="13.8" cy="17.4" r="0.55" fill="#bfe6ff"/>
    <circle cx="20.4" cy="17.6" r="0.55" fill="#fff"/>
    <circle cx="9.2" cy="22.6" r="0.5" fill="#fff"/>
    <circle cx="17.6" cy="34" r="0.5" fill="#9ad4ff"/>
    <circle cx="22" cy="21.6" r="0.45" fill="#fff"/>
  </g>
  <!-- Vincos entre os dedos dobrados -->
  <path d="M18.1 16 v5 M23.3 16.6 v4.6 M28.1 18 v3.6" stroke="#cfeaff" stroke-opacity="0.8" stroke-width="1" stroke-linecap="round"/>
  <path d="M14.2 5.4 v12" stroke="#e6f6ff" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
</svg>
