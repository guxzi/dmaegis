<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40" height="40" viewBox="0 0 40 40">
  <!-- DMAegis: seta de céu noturno (cursor padrão). Desenho próprio. Ponta = ponto ativo (4, 4). -->
  <defs>
    <path id="forma" d="M5.2 3.6 C3.6 2.9 2.6 4 3.1 5.6 L12.8 35.2 C13.5 37.3 15.9 37.6 17.1 35.8 L22.4 27.9 C23.3 26.6 24.7 25.8 26.3 25.6 L35 24.6 C37.2 24.3 37.6 21.6 35.6 20.6 Z"/>
    <clipPath id="recorte"><use xlink:href="#forma" href="#forma"/></clipPath>
    <linearGradient id="ceu" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1e3c8f"/>
      <stop offset="1" stop-color="#0e1b4d"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad4ff"/>
      <stop offset="1" stop-color="#5aa8f0"/>
    </linearGradient>
  </defs>
  <!-- Halo escuro fino para separar de fundos claros -->
  <use xlink:href="#forma" href="#forma" fill="none" stroke="#070b1f" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#recorte)">
    <rect width="40" height="40" fill="url(#ceu)"/>
    <!-- Onda clara na parte de baixo, como uma nuvem de luz -->
    <path d="M14 40 L14 31 C18 27.5 19.5 24.6 24 23.8 C28.5 23 30.5 21.2 33 18 L40 18 L40 40 Z" fill="url(#onda)" fill-opacity="0.85"/>
    <path d="M16.5 40 L16.5 33 C20 29.8 21.5 27.6 25.5 26.8 C29.5 26 31.8 24.8 34 22.5 L40 22.5 L40 40 Z" fill="#c7e8ff" fill-opacity="0.45"/>
    <!-- Lua crescente -->
    <path d="M9.6 11.4 a4.4 4.4 0 1 0 4.6 6.2 a3.4 3.4 0 1 1 -4.6 -6.2 Z" fill="#bfe6ff"/>
    <!-- Estrelas -->
    <path d="M17.2 9.8 L17.75 11.25 L19.2 11.8 L17.75 12.35 L17.2 13.8 L16.65 12.35 L15.2 11.8 L16.65 11.25 Z" fill="#fff"/>
    <path d="M12.8 24.6 L13.2 25.6 L14.2 26 L13.2 26.4 L12.8 27.4 L12.4 26.4 L11.4 26 L12.4 25.6 Z" fill="#fff"/>
    <circle cx="7.4" cy="8.2" r="0.7" fill="#fff"/>
    <circle cx="21.8" cy="16.2" r="0.6" fill="#bfe6ff"/>
    <circle cx="16.4" cy="18.6" r="0.55" fill="#fff"/>
    <circle cx="11" cy="21.4" r="0.5" fill="#9ad4ff"/>
    <circle cx="25.2" cy="19.6" r="0.5" fill="#fff"/>
    <circle cx="15.6" cy="30.2" r="0.5" fill="#fff"/>
  </g>
  <!-- Contorno azul claro, grosso, que destaca no fundo escuro -->
  <use xlink:href="#forma" href="#forma" fill="none" stroke="#8fd0ff" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M5.6 6.2 L13.4 30" stroke="#e6f6ff" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>
</svg>
