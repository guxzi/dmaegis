    <path id="manga" d="M11.4 24 H25.6 L28 29.4 Q26.8 31.4 24.8 30.3 Q22.7 31.7 20.7 30.5 Q18.5 31.8 16.3 30.5 Q14.3 31.7 12.2 30.3 Q10.2 31.4 9 29.4 Z"/>
  </defs>
  <!-- Faísca mágica saindo da ponta do dedo -->
