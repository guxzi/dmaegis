      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="0.5" stop-color="#b39bfb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="punho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a70ff"/>
      <stop offset="1" stop-color="#1f3fc4"/>
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <g id="mao">
      <rect x="10.6" y="1.6" width="5" height="14" rx="2.5"/>
      <rect x="15.4" y="10.4" width="4.4" height="6.2" rx="2.2"/>
      <rect x="19.4" y="11.4" width="4" height="5.6" rx="2"/>
      <rect x="23" y="12.8" width="3.6" height="5" rx="1.8"/>
      <path d="M10.6 13 H26.6 V19.5 Q26.6 25 21.5 25 H14.5 Q10.6 25 10.6 21 Z"/>
      <path d="M11.5 17.4 Q8.6 14.9 7 16.3 Q5.8 17.5 7.2 19.3 L10.6 23.5 Z"/>
